[pytest]
addopts = -p no:launch_testing -p no:launch_ros
testpaths =
    shared/guidemate_msgs/tests
    agent_service/tests
    src/guide_mate_bridge/tests
markers =
    integration: real AWS IoT Core round-trip (set GUIDEMATE_INTEGRATION=1 to run)
    live: real Bedrock model call (set GUIDEMATE_LIVE=1 to run)
    e2e: Playwright browser e2e against a live uvicorn (set GUIDEMATE_E2E=1 to run)
    sim: real Gazebo sim + real IoT Core motion validation (set GUIDEMATE_SIM=1 to run)
filterwarnings =
    # starlette-internal deprecation raised at import time by fastapi's testclient shim; not our code
    ignore:Using .httpx. with .starlette.testclient. is deprecated
