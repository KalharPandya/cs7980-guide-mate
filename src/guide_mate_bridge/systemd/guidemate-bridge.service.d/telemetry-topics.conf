# Per-robot telemetry topic override for turtlebot468.
#
# This unit's Create 3 (firmware H.2.6) publishes dock_status + battery_state ONLY under
# the _do_not_use/ prefix, NOT on the clean /turtlebot468/{dock_status,battery_state}
# names that telemetry.py defaults to. Verified 2026-07-06 with a live rclpy probe:
#   /turtlebot468/_do_not_use/dock_status   -> ~1 Hz  (clean name: 0 publishers)
#   /turtlebot468/_do_not_use/battery_state -> ~0.1 Hz (clean name: 0 publishers)
# Without this override the bridge subscribes to the empty clean topics and reports
# docked=None forever, which BLINDS the dock-guard (command_permitted treats None as
# "not docked" and stops gating on dock state). With it, docked resolves to a real bool.
#
# Note: cmd_vel and the undock/dock ACTIONS *are* exposed on the clean namespace on this
# robot, so only the telemetry subscriptions need remapping — the motion path does not.
# telemetry.py resolves these as node-relative names under /turtlebot468.
[Service]
Environment=GUIDEMATE_DOCK_TOPIC=_do_not_use/dock_status
Environment=GUIDEMATE_BATTERY_TOPIC=_do_not_use/battery_state
