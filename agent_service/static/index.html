<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Robert the Robot Dog</title>
  <link rel="stylesheet" href="/chat.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="paw">🐾</span>
        <h1>Robert</h1>
      </div>
      <div id="status-chip" class="chip chip-virtual" title="connection status">
        <span id="status-mode">virtual</span>
      </div>
      <!-- Task 7 (virtual-pet grant): shown only while connected robot_id ==
           "turtlebotsim" (vs a physical robot). Hidden by default; chat.js
           toggles it from the same /api/session/{id}/state poll that already
           drives the companion banner above. -->
      <span id="virtual-pet-badge" data-testid="virtual-pet-badge" class="chip chip-virtual-pet hidden">🐾 Virtual pet</span>
    </header>

    <!-- Intake gate: collected once, mints the real session row so the
         companion-request + status-poll endpoints work from message one. -->
    <section id="intake" class="card intake">
      <p class="intake-lead">What's your name, and are you comfortable around Physical AI Dogs?</p>
      <input id="name" class="text-input" placeholder="Your name" autocomplete="off" />
      <label class="check-row">
        <input type="checkbox" id="comfortable" />
        I'm comfortable around Physical AI Dogs
      </label>
      <button id="start" class="send" type="button">Start chatting</button>
    </section>

    <div id="chat" hidden>
      <section id="companion-banner" class="banner" aria-live="polite">
        <span id="companion-status">Virtual dog (avatar only)</span>
        <button id="request-companion" class="banner-btn" type="button">Request physical companion</button>
      </section>

      <section class="stage">
        <div id="avatar" class="avatar">
          <!-- Pure inline SVG dog. Emote classes on #avatar drive the CSS animations,
               triggered in JS at the moment reply audio starts playing (not on arrival). -->
          <svg viewBox="0 0 120 120" width="140" height="140" aria-hidden="true">
            <g class="dog-body">
              <ellipse cx="60" cy="92" rx="34" ry="18" class="dog-shadow" />
              <path class="dog-ear ear-left" d="M34 40 q-14 6 -8 30 q10 -6 14 -18 z" />
              <path class="dog-ear ear-right" d="M86 40 q14 6 8 30 q-10 -6 -14 -18 z" />
              <circle cx="60" cy="56" r="30" class="dog-head" />
              <circle cx="50" cy="52" r="4.5" class="dog-eye" />
              <circle cx="70" cy="52" r="4.5" class="dog-eye" />
              <ellipse cx="60" cy="66" rx="7" ry="5" class="dog-snout" />
              <circle cx="60" cy="63" r="3.2" class="dog-nose" />
            </g>
          </svg>
          <span id="emote-label" class="emote-label"></span>
        </div>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="chat-form" class="composer">
        <button id="mic" class="mic" type="button" aria-label="Push to talk">
          <span class="mic-glyph">🎙️</span>
          <span class="mic-level"><span id="mic-level-bar"></span></span>
        </button>
        <input id="message" class="text-input" autocomplete="off"
               placeholder="Say something to Robert…" />
        <button type="submit" class="send">Send</button>
        <button id="new-session" class="ghost" type="button" title="Start a new session">New session</button>
      </form>
    </div>
  </main>
  <audio id="player" hidden></audio>
  <div id="toast" class="toast hidden" role="alert"></div>
  <script src="/chat.js"></script>
</body>
</html>
