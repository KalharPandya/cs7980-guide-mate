services:
  app:
    build:
      context: ..
      dockerfile: agent_service/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - GUIDEMATE_ROBOTS=${GUIDEMATE_ROBOTS:-turtlebot468}
      - GUIDEMATE_IOT_ENDPOINT=${GUIDEMATE_IOT_ENDPOINT:-}
      - GUIDEMATE_MODEL_ID=${GUIDEMATE_MODEL_ID:-us.anthropic.claude-sonnet-4-6}
      - AWS_REGION=${AWS_REGION:-us-west-2}
      - GUIDEMATE_ADMIN_PASSWORD=${GUIDEMATE_ADMIN_PASSWORD:-}
      # L0a origin gate. Defaults mirror guidemate_agent/origin_gate.py (":-" also
      # covers empty values — an empty EXEMPT would block /healthz in enforce mode).
      # Set real values in /etc/guidemate.env; see docs/agent-poc/nuwave-origin-gate.md.
      - GUIDEMATE_ORIGIN_MODE=${GUIDEMATE_ORIGIN_MODE:-off}
      - GUIDEMATE_ORIGIN_ALLOWLIST=${GUIDEMATE_ORIGIN_ALLOWLIST:-155.33.0.0/16,129.10.0.0/16}
      - GUIDEMATE_ORIGIN_EXEMPT=${GUIDEMATE_ORIGIN_EXEMPT:-/healthz,/readyz,/admin,/api/admin}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - GUIDEMATE_DOMAIN=${GUIDEMATE_DOMAIN:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
