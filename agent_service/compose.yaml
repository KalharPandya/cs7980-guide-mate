services:
  app:
    build:
      context: ..
      dockerfile: agent_service/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - GUIDEMATE_ROBOTS=${GUIDEMATE_ROBOTS:-turtlebot468}
      - GUIDEMATE_IOT_ENDPOINT=${GUIDEMATE_IOT_ENDPOINT:-}
      - GUIDEMATE_MODEL_ID=${GUIDEMATE_MODEL_ID:-us.anthropic.claude-sonnet-4-6}
      - AWS_REGION=${AWS_REGION:-us-west-2}
      - GUIDEMATE_ADMIN_PASSWORD=${GUIDEMATE_ADMIN_PASSWORD:-}
      # Voice backend (AWS Polly/Transcribe stay the default if these are unset).
      - GUIDEMATE_TTS_BACKEND=${GUIDEMATE_TTS_BACKEND:-polly}
      - GUIDEMATE_STT_BACKEND=${GUIDEMATE_STT_BACKEND:-transcribe}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}

  world-server:
    build:
      context: ..
      dockerfile: world/Dockerfile
    restart: unless-stopped
    expose:
      - "2567"
    environment:
      - PORT=2567
      # Task 2.3's IoT bridge (world/src/iot/bridge.ts): reuses the same
      # /etc/guidemate.env pattern as the "app" service's GUIDEMATE_IOT_ENDPOINT above.
      # All three empty by default -- world/src/index.ts's startIotBridgeFromEnv logs and
      # continues without the bridge when they're not all set (e.g. local/no-cert runs);
      # the Virtual-Fleet IoT identity these would point at is not provisioned yet (see
      # docs/agent-poc/access-ground-truth.md).
      - GUIDEMATE_IOT_ENDPOINT=${GUIDEMATE_IOT_ENDPOINT:-}
      - GUIDEMATE_CERT=${GUIDEMATE_CERT:-}
      - GUIDEMATE_KEY=${GUIDEMATE_KEY:-}
      - GUIDEMATE_CA=${GUIDEMATE_CA:-}
    # The Virtual-Fleet mTLS cert/key/CA live on the host (provisioned out of band from SSM
    # Parameter Store, see docs/superpowers/plans/2026-08-09-session-resume.md) and are bind
    # mounted read only, because the bridge reads them as file paths (readFileSync in
    # world/src/iot/bridge.ts). GUIDEMATE_CERT/KEY/CA in /etc/guidemate.env point at these
    # in-container paths. Absent on a local run, the dir is simply empty and startIotBridgeFromEnv
    # logs and continues without the bridge, so this mount never breaks a no-cert environment.
    volumes:
      - /opt/guidemate/certs:/certs:ro

  world-client:
    build:
      context: ..
      dockerfile: world-client/Dockerfile
      args:
        # Sub-path this build is served from. MUST match the /viz/* handle_path in ./Caddyfile
        # (the edge strips the prefix, this base puts it back on the URLs the browser asks for)
        # -- see world-client/Dockerfile for the full explanation.
        - VITE_BASE_PATH=/viz/
        # The Colyseus endpoint the BROWSER dials, baked in at build time (Vite inlines
        # import.meta.env.* -- a static bundle has no runtime env). Derived from GUIDEMATE_DOMAIN
        # rather than hardcoded, so the production hostname lives only in /etc/guidemate.env
        # (deploy/user_data.sh writes it there as a bare hostname, e.g. echo.kalhar.ca) and this
        # resolves to wss://echo.kalhar.ca/world, matching the /world/* route in ./Caddyfile.
        # GUIDEMATE_WORLD_WS_URL is the explicit override for anything that is not "same domain,
        # /world, TLS" -- e.g. a local Docker run reached over plain http on a mapped port, where
        # you would set it to ws://localhost:<port>/world.
        # The inner ":-localhost" mirrors the caddy service's own GUIDEMATE_DOMAIN default below,
        # so a bare `docker compose up` with no env file still produces a well-formed URL
        # (wss://localhost/world) rather than the malformed "wss:///world" a bare
        # ${GUIDEMATE_DOMAIN} would yield.
        - VITE_WORLD_SERVER_URL=${GUIDEMATE_WORLD_WS_URL:-wss://${GUIDEMATE_DOMAIN:-localhost}/world}
    restart: unless-stopped
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
      - world-server
      - world-client
    ports:
      - "80:80"
      - "443:443"
    environment:
      - GUIDEMATE_DOMAIN=${GUIDEMATE_DOMAIN:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
