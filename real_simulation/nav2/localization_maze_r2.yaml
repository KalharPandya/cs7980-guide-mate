# GuideMate — AMCL localization params for robot_2 (maze_truth map).
# Copy of localization_maze.yaml with frames prefixed robot_2/* and the initial
# pose seeded at robot_2's spawn (6.0, -2.0) so AMCL converges at spawn.
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # --- frames: sim publishes TF prefixed with the robot_2/ namespace ---
    base_frame_id: "robot_2/base_link"
    odom_frame_id: "robot_2/odom"
    global_frame_id: "map"                   # shared world frame (fleet-shaped)
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan                         # relative -> /robot_2/scan
    # --- seed initial pose at robot_2's spawn: door_B (see sim_r2.sh) ---
    set_initial_pose: true
    initial_pose:
      x: 0.4
      y: 0.0
      z: 0.0
      yaw: -0.34

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
